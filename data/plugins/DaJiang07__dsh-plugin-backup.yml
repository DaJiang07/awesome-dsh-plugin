url: https://github.com/DaJiang07/dsh-plugin-backup
name: DaJiang07/dsh-plugin-backup
category: dev
description:
  en: "Backs up every installed plugin bundle and the profile's whole settings layer into one JSON file, then restores it on another machine: it writes the configuration back, restores local plugin sources and plugin-owned data, and installs the plugin bundles the backup recorded that the machine is missing."
  zh: '把已安装的插件包与整个 profile 配置层打包成一个 JSON 文件，换机后一键恢复：写回配置、还原本地插件源码与插件数据，并安装备份里记录、本机缺失的插件包。'
